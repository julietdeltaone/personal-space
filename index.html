<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Space">
<title>Personal space</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23090b11'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%2345e0b0' stroke-width='6' stroke-dasharray='70 31' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
try { document.documentElement.dataset.theme = localStorage.getItem('psd.theme') || 'dark'; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
@property --glow-h { syntax: '<number>'; inherits: true; initial-value: 190; }

:root {
  --font: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --glow-h: 190;
  transition: --glow-h 1.6s ease;
}
[data-theme="dark"] {
  --bg: #090b11; --bg-2: #0e1119;
  --panel: rgba(255,255,255,.035); --panel-hi: rgba(255,255,255,.07);
  --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.15);
  --text: #eceff7; --muted: #8b92a8; --faint: #565d76;
  --track: rgba(255,255,255,.075);
  --spot: rgba(255,255,255,.07);
  --shadow: 0 30px 80px -34px rgba(0,0,0,.8);
  --sheet-bg: #10131c;
  --blob-o: .26; --score-l: 62%;
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #eef1f7; --bg-2: #f8f9fd;
  --panel: rgba(255,255,255,.7); --panel-hi: rgba(255,255,255,.95);
  --line: rgba(20,28,60,.09); --line-2: rgba(20,28,60,.17);
  --text: #121729; --muted: #596280; --faint: #9aa2ba;
  --track: rgba(20,28,60,.08);
  --spot: rgba(255,255,255,.9);
  --shadow: 0 30px 70px -38px rgba(30,40,90,.4);
  --sheet-bg: #fbfcff;
  --blob-o: .34; --score-l: 44%;
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  min-height: 100dvh; line-height: 1.45; overflow-x: hidden;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body:has(dialog[open]) { overflow: hidden; }
button { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ambient light, tinted by the overall score */
.aura { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aura i { position: absolute; border-radius: 50%; opacity: var(--blob-o); will-change: transform; }
.aura i:nth-child(1) { width: 70vmax; height: 70vmax; left: -22vmax; top: -30vmax;
  background: radial-gradient(closest-side, hsl(var(--glow-h) 85% 52%), transparent);
  animation: drift1 42s ease-in-out infinite alternate; }
.aura i:nth-child(2) { width: 62vmax; height: 62vmax; right: -24vmax; top: 18vh;
  background: radial-gradient(closest-side, hsl(calc(var(--glow-h) + 70) 80% 50%), transparent);
  animation: drift2 55s ease-in-out infinite alternate; }
.aura i:nth-child(3) { width: 56vmax; height: 56vmax; left: 20vw; bottom: -34vmax;
  background: radial-gradient(closest-side, hsl(calc(var(--glow-h) - 60) 75% 50%), transparent);
  animation: drift3 48s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate3d(14vmax, 10vmax, 0) scale(1.12); } }
@keyframes drift2 { to { transform: translate3d(-12vmax, -8vmax, 0) scale(.92); } }
@keyframes drift3 { to { transform: translate3d(10vmax, -12vmax, 0) scale(1.1); } }

.wrap { width: min(1120px, 100%); margin: 0 auto; padding: calc(22px + env(safe-area-inset-top)) 20px calc(130px + env(safe-area-inset-bottom)); }

/* header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 600; letter-spacing: -.03em; }
#lastLogged { color: var(--muted); font-size: 14px; margin-top: 2px; transition: color .4s; }
#lastLogged.stale { color: hsl(38 90% var(--score-l)); }
.tools { display: flex; align-items: center; gap: 8px; }
.sync, .icon {
  all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid var(--line); background: var(--panel);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 99px; transition: background .3s, border-color .3s;
}
.sync:hover, .icon:hover { background: var(--panel-hi); border-color: var(--line-2); }
.sync { display: inline-flex; align-items: center; gap: 9px; padding: 0 14px; height: 40px; font-size: 13px; font-weight: 500; color: var(--muted); }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); transition: background .4s, box-shadow .4s; }
.sync[data-state="ok"] .dot { background: hsl(150 70% var(--score-l)); box-shadow: 0 0 10px hsl(150 70% 50% / .7); }
.sync[data-state="saving"] .dot { background: hsl(40 90% var(--score-l)); animation: blink 1s ease-in-out infinite; }
.sync[data-state="queued"] .dot, .sync[data-state="error"] .dot { background: hsl(8 82% var(--score-l)); }
@keyframes blink { 50% { opacity: .25; } }
.icon { position: relative; width: 40px; height: 40px; display: grid; place-items: center; overflow: hidden; }
.icon svg { position: absolute; width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .7s var(--ease), opacity .4s; }
[data-theme="dark"] .i-sun { opacity: 0; transform: rotate(-90deg) scale(.4); }
[data-theme="light"] .i-moon { opacity: 0; transform: rotate(90deg) scale(.4); }
:is(.sync, .icon, .btn, .fab, .row-btn, .seg button, .meter, .chip-ok, .seg-g):focus-visible { outline: 2px solid hsl(var(--glow-h) 80% 62%); outline-offset: 3px; }

/* panels */
.panel {
  position: relative; isolation: isolate; border: 1px solid var(--line); background: var(--panel); border-radius: 28px;
  backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); box-shadow: var(--shadow);
}
.panel::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .5s;
  background: radial-gradient(520px circle at var(--mx, 50%) var(--my, 0%), var(--spot), transparent 60%);
}
.panel:hover::before { opacity: 1; }

.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
@media (max-width: 880px) { .hero { grid-template-columns: 1fr; } }

/* ring */
.ring-panel { padding: 14px; display: grid; place-items: center; }
.ring-wrap { position: relative; width: min(100%, 520px); container-type: inline-size; }
.halo {
  position: absolute; inset: 14%; border-radius: 50%; filter: blur(40px); opacity: .5; pointer-events: none;
  background: radial-gradient(closest-side, hsl(var(--glow-h) 85% 50% / .55), transparent);
  animation: breathe 7s ease-in-out infinite;
}
.ring-wrap.perfect .halo { opacity: .95; animation-duration: 3.6s; }
@keyframes breathe { 50% { transform: scale(1.1); opacity: .75; } }
.ring { position: relative; display: block; width: 100%; height: auto; overflow: visible; }
.orbit { fill: none; stroke: var(--line-2); stroke-width: 1.2; stroke-dasharray: 1 9; stroke-linecap: round; transform-origin: 0 0; animation: spin 140s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.track, .fill, .hit { fill: none; stroke-linecap: round; }
.track { stroke: var(--track); stroke-width: 12; }
.fill { stroke-width: 12; stroke-dasharray: 0 100; opacity: 0; transition: stroke-dasharray 1.2s var(--ease), stroke .7s, opacity .35s; filter: drop-shadow(0 0 7px var(--seg, transparent)); }
.hit { stroke: transparent; stroke-width: 38; cursor: pointer; }
.seg-g { outline: none; transition: opacity .35s; }
.ring.hov .seg-g:not(.on) { opacity: .32; }
.ring text { font-family: var(--font); font-size: 13px; font-weight: 520; fill: var(--muted); transition: fill .3s; pointer-events: none; }
.seg-g.on text { fill: var(--text); }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 0 24%; }
.big { font-size: clamp(44px, 17cqw, 92px); font-weight: 600; letter-spacing: -.045em; line-height: 1; font-variant-numeric: tabular-nums; transition: color .8s; text-shadow: 0 0 40px color-mix(in srgb, currentColor 38%, transparent); }
.cap { margin-top: 8px; font-size: clamp(13px, 3.4cqw, 16px); font-weight: 520; }
.sub { margin-top: 4px; color: var(--muted); font-size: clamp(11px, 2.7cqw, 13px); line-height: 1.35; min-height: 2.7em; }

/* fix first */
.list-panel { padding: 26px 24px 22px; display: flex; flex-direction: column; }
.list-panel h2 { font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
.list-sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.rows { list-style: none; padding: 0; display: grid; gap: 4px; margin-top: 16px; }
.rows li.enter { animation: rowIn .7s var(--ease) backwards; animation-delay: calc(var(--i) * 70ms + 900ms); }
@keyframes rowIn { from { opacity: 0; transform: translateX(14px); } }
.row-btn { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 8px 12px; width: 100%; padding: 12px 14px; border-radius: 16px; cursor: pointer; transition: background .3s; }
.row-btn:hover { background: var(--panel-hi); }
.row-name { font-weight: 550; }
.delta { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 550; vertical-align: 1px; background: color-mix(in srgb, currentColor 15%, transparent); }
.delta.up { color: hsl(150 62% var(--score-l)); }
.delta.down { color: hsl(8 80% var(--score-l)); }
.row-score { font-size: 19px; font-weight: 620; font-variant-numeric: tabular-nums; transition: color .6s; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; transition: width 1s var(--ease), background-color .7s; }
.row-hint { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.inplace { margin-top: auto; padding-top: 18px; }
.inplace h3 { font-size: 13px; font-weight: 550; color: var(--muted); margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-ok { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); font-size: 13px; color: var(--muted); transition: background .3s, border-color .3s, color .3s; animation: chipIn .6s var(--ease) backwards; animation-delay: calc(var(--i) * 40ms); }
.chip-ok:hover { background: var(--panel-hi); border-color: var(--line-2); color: var(--text); }
.chip-ok svg { width: 14px; height: 14px; fill: none; stroke: hsl(150 62% var(--score-l)); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
@keyframes chipIn { from { opacity: 0; transform: scale(.85); } }
.empty { color: var(--muted); font-size: 14px; padding: 18px 14px; }

/* trend */
.trend { margin-top: 20px; padding: 24px 24px 22px; }
.trend-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.trend h2 { font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
.seg { position: relative; display: inline-flex; gap: 2px; padding: 4px; border-radius: 99px; background: var(--track); overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { all: unset; box-sizing: border-box; position: relative; z-index: 1; padding: 7px 14px; border-radius: 99px; font-size: 13px; font-weight: 520; color: var(--muted); cursor: pointer; white-space: nowrap; transition: color .35s; }
.seg button[aria-pressed="true"] { color: var(--bg); }
.seg .pill { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; border-radius: 99px; background: var(--text); transition: transform .55s var(--ease), width .55s var(--ease); }
.series { margin-top: 14px; }
.chart-wrap { position: relative; margin-top: 18px; touch-action: pan-y; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--faint); font-size: 11px; font-family: var(--font); }
.chart .ln { fill: none; stroke: url(#lg); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.chart .ar { fill: url(#lg); fill-opacity: .13; stroke: none; }
.chart .play .ln { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.5s var(--ease) forwards; }
.chart .play .ar { animation: fadeIn 1.2s .5s backwards; }
.chart .play .dt { animation: fadeIn .6s 1.1s backwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadeIn { from { opacity: 0; } }
.chart .dt { fill: var(--bg-2); stroke-width: 2; }
.chart .pulse { fill: none; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
@keyframes pulse { from { transform: scale(1); opacity: .8; } to { transform: scale(3.4); opacity: 0; } }
.chart .xh { stroke: var(--line-2); stroke-width: 1; opacity: 0; transition: opacity .2s; }
.chart .fh { fill: var(--bg-2); stroke-width: 2.5; opacity: 0; transition: opacity .2s; }
.tip { position: absolute; z-index: 3; left: 0; top: 0; padding: 8px 12px; border-radius: 12px; font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(-50%, -135%); transition: opacity .2s, left .12s linear, top .12s linear; background: var(--sheet-bg); border: 1px solid var(--line-2); box-shadow: var(--shadow); }
.tip b { display: block; font-size: 15px; font-weight: 620; }
.tip span { color: var(--muted); }
.heat-wrap { margin-top: 20px; }
.heat-wrap p { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.heat { display: grid; grid-template-columns: repeat(28, 1fr); gap: 4px; }
@media (max-width: 560px) { .heat { grid-template-columns: repeat(14, 1fr); } }
.heat i { aspect-ratio: 1; border-radius: 6px; border: 1px dashed var(--line-2); }
.heat i.has { border: 0; opacity: .88; }
.heat i.today { outline: 2px solid var(--text); outline-offset: 1px; }
.heat.play i { animation: cellIn .6s var(--ease) backwards; animation-delay: calc(var(--i) * 16ms); }
@keyframes cellIn { from { opacity: 0; transform: scale(.4); } }
.stat { margin-top: 16px; color: var(--muted); font-size: 14px; }
.legend { margin-top: 22px; color: var(--faint); font-size: 12.5px; line-height: 1.6; }
.legend code { font-family: var(--mono); color: var(--muted); letter-spacing: .08em; }

/* floating action */
.fab {
  all: unset; box-sizing: border-box; position: fixed; z-index: 20; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom));
  transform: translateX(-50%); display: inline-flex; align-items: center; gap: 10px; padding: 0 26px 0 20px; height: 56px; border-radius: 99px; cursor: pointer;
  background: var(--text); color: var(--bg); font-weight: 600; font-size: 16px;
  box-shadow: 0 18px 50px -14px hsl(var(--glow-h) 85% 50% / .75), 0 2px 0 rgba(255,255,255,.25) inset;
  transition: transform .5s var(--ease), box-shadow .5s;
}
.fab:hover { transform: translateX(-50%) translateY(-3px); }
.fab:active { transform: translateX(-50%) scale(.96); }
.fab svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; transition: transform .5s var(--ease); }
.fab:hover svg { transform: rotate(90deg); }
.fab.nudge::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid hsl(var(--glow-h) 85% 60%); animation: ring 2.4s ease-out infinite; pointer-events: none; }
@keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.35, 1.7); opacity: 0; } }

/* dialogs */
dialog { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; border: 0; padding: 0; background: transparent; color: var(--text); overflow: hidden; }
dialog[open] { display: flex; align-items: flex-end; justify-content: center; }
dialog::backdrop { background: rgba(4,6,12,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transition: opacity .4s; }
dialog.open::backdrop { opacity: 1; }
.sheet { position: relative; width: min(100%, 580px); max-height: 93dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--sheet-bg); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 28px 28px 0 0; transform: translateY(106%); transition: transform .6s var(--ease); box-shadow: var(--shadow); }
dialog.open .sheet { transform: none; }
@media (min-width: 720px) {
  dialog[open] { align-items: center; }
  .sheet { border-bottom: 1px solid var(--line-2); border-radius: 28px; transform: translateY(26px) scale(.97); opacity: 0; transition: transform .6s var(--ease), opacity .4s; }
  dialog.open .sheet { opacity: 1; transform: none; }
}
.sheet-pad { padding: 20px 22px 4px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line-2); margin: -8px auto 14px; }
@media (min-width: 720px) { .grab { display: none; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
.codebox { display: grid; gap: 6px; margin: 16px 0 6px; }
.codebox span { font-size: 13px; color: var(--muted); }
.codebox input { all: unset; box-sizing: border-box; width: 100%; padding: 12px 16px; border-radius: 14px; background: var(--track); border: 1px solid transparent; font-family: var(--mono); font-size: 22px; letter-spacing: .5em; transition: border-color .3s, background .3s; }
.codebox input::placeholder { color: var(--faint); letter-spacing: .04em; font-size: 15px; font-family: var(--font); }
.codebox input:focus { border-color: hsl(var(--glow-h) 80% 60%); background: var(--panel); }
.mgroup { margin: 20px 0 4px; font-size: 13px; font-weight: 550; color: var(--muted); }
.mrow { padding: 12px 0 16px; }
.mtop { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px; }
.mname { font-weight: 550; }
.mval { font-size: 20px; font-weight: 620; font-variant-numeric: tabular-nums; display: inline-block; transition: color .3s; }
.meter { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; height: 40px; touch-action: pan-y; cursor: pointer; outline: none; user-select: none; -webkit-user-select: none; --c: var(--faint); }
.meter i { position: relative; border-radius: 8px; background: var(--track); transition: background-color .25s, box-shadow .3s; }
.meter i.on { background: var(--c); box-shadow: 0 0 18px -5px var(--c); }
.meter i.last::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--muted); }
.mhint { margin-top: 12px; color: var(--muted); font-size: 13px; min-height: 1.4em; }
.sheet-foot { position: sticky; bottom: 0; display: flex; gap: 10px; padding: 16px 22px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--sheet-bg) 72%, transparent); }
.btn { all: unset; box-sizing: border-box; cursor: pointer; text-align: center; padding: 14px 18px; border-radius: 16px; font-weight: 560; font-size: 15px; border: 1px solid var(--line-2); transition: background .3s, opacity .3s, transform .3s var(--ease); }
.btn:hover { background: var(--panel-hi); }
.btn:active { transform: scale(.97); }
.btn.primary { flex: 1; background: var(--text); color: var(--bg); border-color: transparent; font-weight: 620; }
.btn.primary:hover { background: var(--text); opacity: .9; }
.btn[aria-disabled="true"] { opacity: .35; cursor: not-allowed; }
.connect { padding: 26px 22px calc(24px + env(safe-area-inset-bottom)); display: grid; gap: 14px; }
.connect p { color: var(--muted); font-size: 14px; }
.field { display: grid; gap: 6px; }
.field span { font-size: 13px; color: var(--muted); }
.field input { all: unset; box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: 14px; background: var(--track); border: 1px solid transparent; font-size: 15px; transition: border-color .3s; }
.field input:focus { border-color: hsl(var(--glow-h) 80% 60%); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 24px); opacity: 0; padding: 12px 18px; border-radius: 99px; font-size: 14px; font-weight: 520; background: var(--sheet-bg); border: 1px solid var(--line-2); box-shadow: var(--shadow); pointer-events: none; transition: transform .6s var(--ease), opacity .4s; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }

::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
::view-transition-old(root) { z-index: 1; }
::view-transition-new(root) { z-index: 2; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0ms !important; }
}
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="wrap">
  <header class="top">
    <div>
      <h1>Personal space</h1>
      <p id="lastLogged">Loading</p>
    </div>
    <div class="tools">
      <button class="sync" id="syncBtn" data-state="local" aria-label="Connection settings"><span class="dot"></span><span id="syncText">Local only</span></button>
      <button class="icon" id="themeBtn" aria-label="Switch theme">
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="panel ring-panel">
      <div class="ring-wrap" id="ringWrap">
        <div class="halo" aria-hidden="true"></div>
        <svg class="ring" id="ring" viewBox="-250 -250 500 500" role="group" aria-label="Score by area"></svg>
        <div class="center">
          <div class="big" id="bigNum">–</div>
          <div class="cap" id="bigCap">overall</div>
          <div class="sub" id="bigSub"></div>
        </div>
      </div>
    </div>

    <div class="panel list-panel">
      <h2 id="listTitle">Fix first</h2>
      <p class="list-sub" id="listSub"></p>
      <ul class="rows" id="rows"></ul>
      <div class="inplace" id="inplace" hidden>
        <h3>In place</h3>
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </section>

  <section class="panel trend">
    <div class="trend-head">
      <h2>Trend</h2>
      <div class="seg" id="rangeSeg" role="group" aria-label="Range">
        <span class="pill"></span>
        <button type="button" data-v="14" aria-pressed="false">2 weeks</button>
        <button type="button" data-v="30" aria-pressed="true">30 days</button>
        <button type="button" data-v="90" aria-pressed="false">90 days</button>
      </div>
    </div>
    <div class="seg series" id="seriesSeg" role="group" aria-label="Area"><span class="pill"></span></div>
    <div class="chart-wrap" id="chartWrap">
      <svg class="chart" id="chart" viewBox="0 0 720 240" role="img" aria-label="Score trend"></svg>
      <div class="tip" id="tip"></div>
    </div>
    <div class="heat-wrap">
      <p>Last 28 days</p>
      <div class="heat" id="heat"></div>
    </div>
    <p class="stat" id="statLine"></p>
    <p class="legend" id="legend"></p>
  </section>
  <p class="sr" id="srSummary" aria-live="polite"></p>
</main>

<button class="fab" id="fab" aria-label="Log update">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Log update</span>
</button>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheetPanel">
    <div class="sheet-pad">
      <div class="grab"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle">Log update</h2>
        <button class="icon" id="closeSheet" aria-label="Close"><svg viewBox="0 0 24 24" style="position:static"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <label class="codebox"><span>Quick code</span>
        <input id="codeInput" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Type digits or tap the bars below">
      </label>
      <div id="meters"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn" id="allTen" type="button">All 10</button>
      <button class="btn" id="resetLast" type="button">Reset</button>
      <button class="btn primary" id="logBtn" type="button">Log update</button>
    </div>
  </div>
</dialog>

<dialog id="connect" aria-labelledby="connectTitle">
  <div class="sheet" id="connectPanel">
    <div class="connect">
      <div class="sheet-head">
        <h2 id="connectTitle">Connect to Google Sheets</h2>
        <button class="icon" id="closeConnect" aria-label="Close"><svg viewBox="0 0 24 24" style="position:static"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p>Paste your Apps Script web app URL and the secret from Code.gs. Both stay on this device. Entries logged before connecting are uploaded once you save.</p>
      <label class="field"><span>Web app URL</span><input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" spellcheck="false"></label>
      <label class="field"><span>Secret</span><input id="cfgKey" type="password" placeholder="Same value as SECRET in Code.gs" autocomplete="off" spellcheck="false"></label>
      <div class="btn-row">
        <button class="btn primary" id="cfgSave" type="button">Save and sync</button>
        <button class="btn" id="cfgCopy" type="button">Copy phone setup link</button>
        <button class="btn" id="cfgOff" type="button">Disconnect</button>
      </div>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ---------- Areas. Add new ones at the END only so old codes stay valid. ---------- */
const SLOTS = [
  { id: 'floor',    label: 'Floor and tidiness', short: 'Floor',    group: 'Space',
    a: { lo: 'Things on the floor, towels and shoes out of place', mid: 'A handful of things out of their spots', hi: 'Everything in its spot, shirts hung' } },
  { id: 'hygiene',  label: 'Hygiene',            short: 'Hygiene',  group: 'Space',
    a: { lo: 'Bathroom needs cleaning or supplies have run out', mid: 'Due for a wipe-down or a restock', hi: 'Bathroom clean, supplies stocked' } },
  { id: 'laundry',  label: 'Laundry',            short: 'Laundry',  group: 'Space',
    a: { lo: 'Behind schedule, piles building up', mid: 'Washed but not folded or put away', hi: 'On schedule (a filling basket Mon to Fri is normal)' } },
  { id: 'vehicle',  label: 'Vehicle',            short: 'Vehicle',  group: 'Space',
    a: { lo: 'Dirty inside and out', mid: 'Inside or outside needs work', hi: 'Clean inside and out' } },
  { id: 'homework', label: 'Homework',           short: 'Homework', group: 'Tasks and habits',
    a: { lo: 'Overdue assignments', mid: 'Work due soon and not started', hi: 'Fully caught up' } },
  { id: 'business', label: 'Business follow-ups', short: 'Business', group: 'Tasks and habits',
    a: { lo: 'Follow-ups overdue', mid: 'A couple of replies pending', hi: 'No follow-ups pending' } },
  { id: 'faith',    label: 'Bible reading',      short: 'Bible',    group: 'Tasks and habits',
    a: { lo: 'Several days missed', mid: 'Missed yesterday', hi: 'Done today, streak intact' } },
];
const IN_PLACE = 8;      // score at or above this counts as "in its place"
const STALE_HOURS = 26;  // nudge to log after this long
const LS = { cfg: 'psd.cfg', confirmed: 'psd.entries', pending: 'psd.pending', theme: 'psd.theme' };

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE = 'cubic-bezier(.22,1,.36,1)';
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const svgEl = (tag, attrs = {}) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const hue = v => { const t = clamp((v - 1) / 9, 0, 1); return t < .5 ? 6 + (t / .5) * 38 : 44 + ((t - .5) / .5) * 128; };
const col = v => `hsl(${hue(v).toFixed(1)} 78% var(--score-l))`;
const band = v => v <= 3 ? 'lo' : v < IN_PLACE ? 'mid' : 'hi';
const anchorFor = (slot, v) => slot.a[band(v)];
const mean = arr => { const v = arr.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const codeOf = vals => vals.map(v => v - 1).join('');
const dayKey = ms => { const d = new Date(ms); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const fmt = n => n.toFixed(1);

/* ---------- state ---------- */
let cfg = load(LS.cfg, { url: '', key: '' });
let confirmed = load(LS.confirmed, []);
let pending = load(LS.pending, []);
let entries = [];
let draft = SLOTS.map(() => null);
let lastVals = SLOTS.map(() => null);
let series = 'overall';
let range = 30;
let hoverI = null;
let syncing = false;
let lastSyncAt = 0;
let chartKey = '', heatKey = '';

function parseEntry(raw) {
  const ms = Date.parse(raw.t);
  if (isNaN(ms)) return null;
  let code = String(raw.c).replace(/\D/g, '');
  const len = Math.max(Number(raw.s) || 0, code.length);
  code = code.padStart(len, '0');
  const vals = SLOTS.map((_, i) => i < code.length ? Number(code[i]) + 1 : null);
  return { t: raw.t, ms, code, vals };
}
function rebuild() {
  const map = new Map();
  confirmed.forEach(e => map.set(e.t, e));
  pending.forEach(e => map.set(e.t, e));
  entries = [...map.values()].map(parseEntry).filter(Boolean).sort((a, b) => a.ms - b.ms);
}
function slotState(i) {
  let cur = null, prev = null;
  for (let k = entries.length - 1; k >= 0; k--) {
    const v = entries[k].vals[i];
    if (v == null) continue;
    if (cur == null) cur = v; else { prev = v; break; }
  }
  return { cur, prev, delta: cur != null && prev != null ? cur - prev : null };
}
const overallNow = () => mean(SLOTS.map((_, i) => slotState(i).cur));
const dailyMap = () => { const m = new Map(); entries.forEach(e => m.set(dayKey(e.ms), e)); return m; };
const valueOf = (e, id) => id === 'overall' ? mean(e.vals) : e.vals[SLOTS.findIndex(s => s.id === id)];
function lastDays(n) {
  const dm = dailyMap(), base = new Date(); base.setHours(12, 0, 0, 0);
  const out = [];
  for (let k = n - 1; k >= 0; k--) { const d = new Date(base); d.setDate(base.getDate() - k); out.push({ date: d, e: dm.get(dayKey(d.getTime())) }); }
  return out;
}
function streak() {
  const dm = dailyMap(), d = new Date(); d.setHours(12, 0, 0, 0);
  let n = 0, first = true;
  for (let k = 0; k < 400; k++) {
    const e = dm.get(dayKey(d.getTime()));
    if (!e) { if (first) { first = false; d.setDate(d.getDate() - 1); continue; } break; }
    first = false;
    const v = e.vals.filter(x => x != null);
    if (v.length && Math.min(...v) >= IN_PLACE) n++; else break;
    d.setDate(d.getDate() - 1);
  }
  return n;
}
function ago(ms) {
  const m = Math.floor((Date.now() - ms) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
  const days = Math.round((new Date().setHours(12, 0, 0, 0) - new Date(ms).setHours(12, 0, 0, 0)) / 864e5);
  return days <= 1 ? 'yesterday' : days + ' days ago';
}

/* ---------- ring ---------- */
const R = 140, GAP = 9;
const polar = (r, deg) => { const a = deg * Math.PI / 180; return [r * Math.cos(a), r * Math.sin(a)]; };
const arcD = (r, a0, a1) => { const [x0, y0] = polar(r, a0), [x1, y1] = polar(r, a1); return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
const ring = $('#ring'), ringWrap = $('#ringWrap');
const bigNum = $('#bigNum'), bigCap = $('#bigCap'), bigSub = $('#bigSub');
const segs = [];
let firstRender = true;

function buildRing() {
  ring.append(svgEl('circle', { class: 'orbit', r: 224 }));
  const step = 360 / SLOTS.length;
  SLOTS.forEach((s, i) => {
    const a0 = -90 + i * step + GAP / 2, a1 = -90 + (i + 1) * step - GAP / 2, d = arcD(R, a0, a1);
    const g = svgEl('g', { class: 'seg-g', tabindex: 0, role: 'button', 'aria-label': s.label });
    const track = svgEl('path', { class: 'track', d });
    const fill = svgEl('path', { class: 'fill', d, pathLength: 100 });
    const hit = svgEl('path', { class: 'hit', d });
    const mid = (a0 + a1) / 2, c = Math.cos(mid * Math.PI / 180), sn = Math.sin(mid * Math.PI / 180);
    const [lx, ly] = polar(R + 30, mid);
    const text = svgEl('text', { x: lx.toFixed(1), y: ly.toFixed(1), 'text-anchor': c > .3 ? 'start' : c < -.3 ? 'end' : 'middle', 'dominant-baseline': 'middle' });
    if (Math.abs(c) <= .3) text.setAttribute('y', (ly + (sn < 0 ? -6 : 6)).toFixed(1));
    text.textContent = s.short;
    g.append(track, fill, hit, text);
    ring.append(g);
    segs.push({ g, fill, text });
    const on = () => { hoverI = i; g.classList.add('on'); ring.classList.add('hov'); renderCenter(false); };
    const off = () => { hoverI = null; g.classList.remove('on'); ring.classList.remove('hov'); renderCenter(false); };
    g.addEventListener('pointerenter', on); g.addEventListener('pointerleave', off);
    g.addEventListener('focus', on); g.addEventListener('blur', off);
    g.addEventListener('click', () => openSheet(s.id));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(s.id); } });
  });
  void ring.getBoundingClientRect();
}

let shown = 0, raf = 0;
function countTo(to) {
  cancelAnimationFrame(raf);
  if (reduceMotion) { shown = to; bigNum.textContent = fmt(to); return; }
  const from = shown, t0 = performance.now(), dur = 1300;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4);
    shown = from + (to - from) * e;
    bigNum.textContent = fmt(shown);
    if (k < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
function statusText() {
  if (!entries.length) return 'Log your first update to light this up';
  const cur = SLOTS.map((_, i) => slotState(i).cur);
  const unrated = cur.filter(v => v == null).length;
  if (unrated) return unrated + (unrated === 1 ? ' area not rated yet' : ' areas not rated yet');
  const below = cur.filter(v => v < IN_PLACE).length;
  return below ? below + (below === 1 ? ' area below ' : ' areas below ') + IN_PLACE : 'Everything is in its place';
}
function renderCenter(animate) {
  if (hoverI != null) {
    cancelAnimationFrame(raf);
    const s = SLOTS[hoverI], v = slotState(hoverI).cur;
    bigNum.textContent = v == null ? '–' : String(v);
    bigNum.style.color = v == null ? 'var(--faint)' : col(v);
    bigCap.textContent = s.label;
    bigSub.textContent = v == null ? 'Not rated yet' : anchorFor(s, v);
    return;
  }
  const o = overallNow();
  bigCap.textContent = 'overall';
  bigSub.textContent = statusText();
  if (o == null) { cancelAnimationFrame(raf); shown = 0; bigNum.textContent = '–'; bigNum.style.color = 'var(--faint)'; return; }
  bigNum.style.color = col(o);
  if (animate) countTo(o); else { cancelAnimationFrame(raf); shown = o; bigNum.textContent = fmt(o); }
}
function renderRing() {
  SLOTS.forEach((s, i) => {
    const { cur } = slotState(i), seg = segs[i], p = cur == null ? 0 : cur / 10;
    if (firstRender) seg.fill.style.transitionDelay = (350 + i * 120) + 'ms';
    seg.fill.style.strokeDasharray = `${p * 100} 100`;
    seg.fill.style.opacity = p > 0 ? 1 : 0;
    if (cur != null) { const c = col(cur); seg.fill.style.stroke = c; seg.fill.style.setProperty('--seg', c); }
  });
  if (firstRender) setTimeout(() => segs.forEach(s => (s.fill.style.transitionDelay = '')), 2400);
  const o = overallNow();
  document.documentElement.style.setProperty('--glow-h', o == null ? 190 : hue(o).toFixed(1));
  const perfect = o != null && SLOTS.every((_, i) => { const v = slotState(i).cur; return v != null && v >= IN_PLACE; });
  ringWrap.classList.toggle('perfect', perfect);
  renderCenter(true);
}

/* ---------- fix first list ---------- */
const rowsEl = $('#rows'), chipsEl = $('#chips'), inplaceEl = $('#inplace');
const rowEls = SLOTS.map((s, i) => {
  const li = document.createElement('li');
  li.dataset.id = s.id;
  li.innerHTML = `<button class="row-btn" type="button">
    <span><span class="row-name">${s.label}</span><span class="delta" hidden></span></span>
    <span class="row-score">–</span>
    <span class="bar"><i></i></span>
    <span class="row-hint"></span></button>`;
  li.querySelector('.row-btn').addEventListener('click', () => openSheet(s.id));
  return { li, delta: li.querySelector('.delta'), score: li.querySelector('.row-score'), fill: li.querySelector('.bar i'), hint: li.querySelector('.row-hint'), attached: false };
});

function renderList() {
  const before = new Map(rowEls.filter(r => r.attached).map(r => [r.li.dataset.id, r.li.getBoundingClientRect().top]));
  const info = SLOTS.map((s, i) => ({ s, i, ...slotState(i) }));
  const need = info.filter(x => x.cur == null || x.cur < IN_PLACE).sort((a, b) => (a.cur ?? 0) - (b.cur ?? 0) || a.i - b.i);
  const ok = info.filter(x => x.cur != null && x.cur >= IN_PLACE);

  $('#listTitle').textContent = !entries.length ? 'Fix first' : need.length ? 'Fix first' : 'Everything is in its place';
  $('#listSub').textContent = !entries.length ? 'Nothing logged yet.' : need.length ? 'Lowest scores first. Tap one to update it.' : 'Keep it there. Log when something moves.';

  const wanted = new Set(need.map(x => x.s.id));
  rowEls.forEach(r => { if (!wanted.has(r.li.dataset.id) && r.attached) { r.li.remove(); r.attached = false; } });
  const emptyMsg = rowsEl.querySelector('.empty'); if (emptyMsg) emptyMsg.remove();
  if (!entries.length) {
    const li = document.createElement('li'); li.className = 'empty';
    li.textContent = 'Tap Log update and rate each area once. This list then sorts itself by what needs attention.';
    rowsEl.append(li);
  }
  need.forEach((x, n) => {
    const r = rowEls[x.i];
    r.score.textContent = x.cur ?? '–';
    r.score.style.color = x.cur == null ? 'var(--faint)' : col(x.cur);
    r.hint.textContent = x.cur == null ? 'Not rated yet' : anchorFor(x.s, x.cur);
    r.delta.hidden = !x.delta;
    if (x.delta) { r.delta.textContent = (x.delta > 0 ? '+' : '−') + Math.abs(x.delta); r.delta.className = 'delta ' + (x.delta > 0 ? 'up' : 'down'); }
    rowsEl.append(r.li);
    if (!r.attached) {
      r.attached = true;
      r.fill.style.width = '0%';
      if (firstRender) { r.li.classList.add('enter'); r.li.style.setProperty('--i', n); }
      void r.fill.offsetWidth;
    }
    r.fill.style.width = ((x.cur ?? 0) * 10) + '%';
    r.fill.style.backgroundColor = x.cur == null ? 'var(--faint)' : col(x.cur);
  });
  // FLIP the survivors into their new order
  if (!reduceMotion) rowEls.forEach(r => {
    if (!r.attached || !before.has(r.li.dataset.id)) return;
    const dy = before.get(r.li.dataset.id) - r.li.getBoundingClientRect().top;
    if (Math.abs(dy) > 1) r.li.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 700, easing: EASE });
  });

  inplaceEl.hidden = !ok.length;
  chipsEl.innerHTML = '';
  ok.forEach((x, n) => {
    const b = document.createElement('button');
    b.className = 'chip-ok'; b.type = 'button'; b.style.setProperty('--i', n);
    b.innerHTML = `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>${x.s.short} ${x.cur}`;
    b.addEventListener('click', () => openSheet(x.s.id));
    chipsEl.append(b);
  });
}

/* ---------- trend ---------- */
const chart = $('#chart'), tip = $('#tip'), chartWrap = $('#chartWrap'), heatEl = $('#heat');
const CW = 720, CH = 240, CL = 30, CR = 12, CT = 14, CB = 28, IW = CW - CL - CR, IH = CH - CT - CB;
let chartPts = [];
const cy = v => CT + (10 - v) / 9 * IH;

function smooth(p) {
  let d = `M${p[0].x.toFixed(1)} ${p[0].y.toFixed(1)}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    const c1y = clamp(p1.y + (p2.y - p0.y) / 6, CT, CT + IH), c2y = clamp(p2.y - (p3.y - p1.y) / 6, CT, CT + IH);
    d += `C${(p1.x + (p2.x - p0.x) / 6).toFixed(1)} ${c1y.toFixed(1)} ${(p2.x - (p3.x - p1.x) / 6).toFixed(1)} ${c2y.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}
function renderChart() {
  const key = series + '|' + range, play = key !== chartKey; chartKey = key;
  const days = lastDays(range);
  const X = i => CL + (days.length > 1 ? i * IW / (days.length - 1) : IW / 2);
  chartPts = [];
  days.forEach((d, i) => { if (!d.e) return; const v = valueOf(d.e, series); if (v == null) return; chartPts.push({ x: X(i), y: cy(v), v, d }); });

  let h = `<defs><linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="${CT}" x2="0" y2="${CT + IH}">`;
  [10, 8, 5.5, 1].forEach(v => { h += `<stop offset="${((10 - v) / 9).toFixed(3)}" style="stop-color:${col(v)}"/>`; });
  h += '</defs>';
  [1, 5, 10].forEach(v => { h += `<line x1="${CL}" x2="${CW - CR}" y1="${cy(v)}" y2="${cy(v)}" stroke="var(--line)"/><text x="${CL - 9}" y="${cy(v) + 4}" text-anchor="end">${v}</text>`; });
  h += `<line x1="${CL}" x2="${CW - CR}" y1="${cy(IN_PLACE)}" y2="${cy(IN_PLACE)}" stroke="${col(IN_PLACE)}" stroke-opacity=".45" stroke-dasharray="3 5"/>`;
  h += `<text x="${CW - CR}" y="${cy(IN_PLACE) - 6}" text-anchor="end">in place</text>`;
  const ticks = [0, .25, .5, .75, 1].map(t => Math.round(t * (days.length - 1)));
  [...new Set(ticks)].forEach((i, n, arr) => {
    const anchor = n === 0 ? 'start' : n === arr.length - 1 ? 'end' : 'middle';
    h += `<text x="${X(i).toFixed(1)}" y="${CH - 6}" text-anchor="${anchor}">${days[i].date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</text>`;
  });
  h += `<g class="${play ? 'play' : ''}">`;
  if (chartPts.length >= 2) {
    const d = smooth(chartPts);
    h += `<path class="ar" d="${d}L${chartPts[chartPts.length - 1].x.toFixed(1)} ${CT + IH}L${chartPts[0].x.toFixed(1)} ${CT + IH}Z"/>`;
    h += `<path class="ln" d="${d}" pathLength="1"/>`;
  }
  if (!chartPts.length) h += `<text x="${CW / 2}" y="${CH / 2}" text-anchor="middle" style="font-size:13px">Nothing logged in this range yet.</text>`;
  chartPts.forEach((p, n) => {
    h += `<circle class="dt" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${n === chartPts.length - 1 ? 5 : 3.2}" style="stroke:${col(p.v)}"/>`;
  });
  if (chartPts.length) { const l = chartPts[chartPts.length - 1]; h += `<circle class="pulse" cx="${l.x.toFixed(1)}" cy="${l.y.toFixed(1)}" r="5" style="stroke:${col(l.v)}"/>`; }
  h += `</g><line class="xh" id="xh" y1="${CT}" y2="${CT + IH}"/><circle class="fh" id="fh" r="6"/><rect id="chit" x="0" y="0" width="${CW}" height="${CH}" fill="transparent"/>`;
  chart.innerHTML = h;
  chart.setAttribute('aria-label', 'Trend for ' + (series === 'overall' ? 'overall score' : SLOTS.find(s => s.id === series).label));

  // heat strip
  const hDays = lastDays(28), hk = series, hplay = hk !== heatKey; heatKey = hk;
  heatEl.className = 'heat' + (hplay ? ' play' : '');
  heatEl.innerHTML = '';
  hDays.forEach((d, i) => {
    const v = d.e ? valueOf(d.e, series) : null, c = document.createElement('i');
    c.style.setProperty('--i', i);
    const label = d.date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    c.title = v == null ? label + ': no entry' : label + ': ' + (series === 'overall' ? fmt(v) : v);
    if (v != null) { c.className = 'has'; c.style.background = col(v); }
    if (i === hDays.length - 1) c.classList.add('today');
    heatEl.append(c);
  });

  // stat line
  const s = streak(), week = mean(lastDays(7).map(d => d.e ? mean(d.e.vals) : null));
  const parts = [];
  if (!entries.length) parts.push('Log a few days and your trend shows up here.');
  else {
    parts.push(s > 0 ? `${s}-day streak with every area at ${IN_PLACE} or higher.` : 'No streak running yet.');
    if (week != null) parts.push(`7-day average ${fmt(week)}.`);
  }
  $('#statLine').textContent = parts.join(' ');
}
chartWrap.addEventListener('pointermove', e => {
  if (!chartPts.length) return;
  const r = chart.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * CW;
  let best = chartPts[0];
  chartPts.forEach(p => { if (Math.abs(p.x - vx) < Math.abs(best.x - vx)) best = p; });
  const xh = $('#xh'), fh = $('#fh');
  xh.setAttribute('x1', best.x); xh.setAttribute('x2', best.x); xh.style.opacity = 1;
  fh.setAttribute('cx', best.x); fh.setAttribute('cy', best.y); fh.style.stroke = col(best.v); fh.style.opacity = 1;
  tip.innerHTML = `<span>${best.d.date.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}</span><b style="color:${col(best.v)}">${series === 'overall' ? fmt(best.v) : best.v}</b>`;
  tip.style.left = clamp(best.x / CW * 100, 9, 91) + '%';
  tip.style.top = (best.y / CH * 100) + '%';
  tip.style.opacity = 1;
});
chartWrap.addEventListener('pointerleave', () => { tip.style.opacity = 0; const xh = $('#xh'), fh = $('#fh'); if (xh) { xh.style.opacity = 0; fh.style.opacity = 0; } });

/* sliding pill segmented controls */
function movePill(seg, instant) {
  const b = seg.querySelector('[aria-pressed="true"]'), p = seg.querySelector('.pill');
  if (!b || !p) return;
  if (instant) p.style.transition = 'none';
  p.style.width = b.offsetWidth + 'px';
  p.style.transform = `translateX(${b.offsetLeft}px)`;
  if (instant) { void p.offsetWidth; p.style.transition = ''; }
  seg.scrollTo({ left: Math.max(0, b.offsetLeft - 24), behavior: instant || reduceMotion ? 'auto' : 'smooth' });
}
const seriesSeg = $('#seriesSeg'), rangeSeg = $('#rangeSeg');
[['overall', 'Overall'], ...SLOTS.map(s => [s.id, s.short])].forEach(([id, label]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.v = id; b.textContent = label; b.setAttribute('aria-pressed', String(id === series));
  seriesSeg.append(b);
});
seriesSeg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  series = b.dataset.v;
  seriesSeg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  movePill(seriesSeg); renderChart();
});
rangeSeg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  range = Number(b.dataset.v);
  rangeSeg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  movePill(rangeSeg); renderChart();
});

/* ---------- header / footer ---------- */
function renderHeader() {
  const last = entries[entries.length - 1], t = $('#lastLogged');
  let stale = false;
  if (!last) { t.textContent = 'No entries yet'; stale = true; }
  else { t.textContent = 'Last logged ' + ago(last.ms); stale = Date.now() - last.ms > STALE_HOURS * 36e5; }
  t.classList.toggle('stale', stale && !!last);
  $('#fab').classList.toggle('nudge', stale);
  $('#legend').innerHTML = (last ? `Latest code <code>${last.code}</code>. ` : '') +
    'One digit per area, 0 to 9, shown here as 1 to 10. Order: ' + SLOTS.map(s => s.short).join(', ') + '.';
}
function renderAll() {
  renderHeader(); renderRing(); renderList(); renderChart();
  const cur = SLOTS.map((s, i) => `${s.label} ${slotState(i).cur ?? 'not rated'}`).join(', ');
  $('#srSummary').textContent = entries.length ? 'Overall ' + fmt(overallNow() ?? 0) + '. ' + cur : '';
  firstRender = false;
}

/* ---------- dialogs ---------- */
function openDialog(d) {
  d.showModal();
  requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('open')));
}
function closeDialog(d) {
  if (!d.open) return;
  d.classList.remove('open');
  if (reduceMotion) d.close(); else setTimeout(() => d.close(), 420);
}
document.querySelectorAll('dialog').forEach(d => {
  d.addEventListener('cancel', e => { e.preventDefault(); closeDialog(d); });
  d.addEventListener('pointerdown', e => { if (e.target === d) closeDialog(d); });
});
$('#closeSheet').addEventListener('click', () => closeDialog($('#sheet')));
$('#closeConnect').addEventListener('click', () => closeDialog($('#connect')));

/* ---------- log sheet ---------- */
const sheet = $('#sheet'), codeInput = $('#codeInput'), logBtn = $('#logBtn');
const meters = [];
function buildMeters() {
  const host = $('#meters');
  [...new Set(SLOTS.map(s => s.group))].forEach(g => {
    const h = document.createElement('h3'); h.className = 'mgroup'; h.textContent = g; host.append(h);
    SLOTS.forEach((s, i) => {
      if (s.group !== g) return;
      const row = document.createElement('div');
      row.className = 'mrow'; row.dataset.id = s.id;
      row.innerHTML = `<div class="mtop"><span class="mname">${s.label}</span><span class="mval">–</span></div>
        <div class="meter" role="slider" tabindex="0" aria-label="${s.label}" aria-valuemin="1" aria-valuemax="10">${'<i></i>'.repeat(10)}</div>
        <p class="mhint"></p>`;
      host.append(row);
      const m = { row, el: row.querySelector('.meter'), val: row.querySelector('.mval'), hint: row.querySelector('.mhint'), cells: [...row.querySelectorAll('.meter i')] };
      meters[i] = m;
      const fromX = x => { const r = m.el.getBoundingClientRect(); return clamp(Math.ceil((x - r.left) / r.width * 10), 1, 10); };
      let down = false;
      m.el.addEventListener('pointerdown', e => {
        down = true; m.el.setPointerCapture(e.pointerId);
        if (e.pointerType !== 'touch') setVal(i, fromX(e.clientX));
      });
      m.el.addEventListener('pointermove', e => { if (down) setVal(i, fromX(e.clientX)); });
      m.el.addEventListener('pointerup', e => { if (down && e.pointerType === 'touch') setVal(i, fromX(e.clientX)); down = false; });
      m.el.addEventListener('pointercancel', () => { down = false; });
      m.el.addEventListener('keydown', e => {
        const v = draft[i] ?? 0;
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') setVal(i, v + 1);
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') setVal(i, v - 1);
        else if (e.key === 'Home') setVal(i, 1);
        else if (e.key === 'End') setVal(i, 10);
        else if (/^[0-9]$/.test(e.key)) setVal(i, e.key === '0' ? 10 : Number(e.key));
        else return;
        e.preventDefault();
      });
    });
  });
}
function paintMeter(i) {
  const m = meters[i], v = draft[i];
  m.cells.forEach((c, k) => { c.classList.toggle('on', v != null && k < v); c.classList.toggle('last', lastVals[i] != null && k === lastVals[i] - 1); });
  m.el.style.setProperty('--c', v != null ? col(v) : 'var(--faint)');
  if (v != null) { m.el.setAttribute('aria-valuenow', v); m.el.removeAttribute('aria-valuetext'); } else { m.el.removeAttribute('aria-valuenow'); m.el.setAttribute('aria-valuetext', 'Not rated'); }
  m.val.textContent = v ?? '–';
  m.val.style.color = v != null ? col(v) : 'var(--faint)';
  m.hint.textContent = v == null ? 'Tap or drag to rate' : anchorFor(SLOTS[i], v);
}
function setVal(i, v, opts = {}) {
  v = clamp(v, 1, 10);
  if (draft[i] === v) return;
  draft[i] = v; paintMeter(i);
  if (!reduceMotion) meters[i].val.animate([{ transform: 'scale(1.4)' }, { transform: 'scale(1)' }], { duration: 320, easing: EASE });
  if (!opts.noCode) syncCode();
  updateLogBtn();
}
const complete = () => draft.every(v => v != null);
function syncCode() { codeInput.value = complete() ? codeOf(draft) : ''; }
function updateLogBtn() {
  const missing = draft.filter(v => v == null).length;
  logBtn.textContent = missing ? `Rate ${missing} more` : 'Log update';
  logBtn.setAttribute('aria-disabled', String(missing > 0));
}
function openSheet(focusId, preset) {
  if (!meters.length) buildMeters();
  lastVals = SLOTS.map((_, i) => slotState(i).cur);
  draft = preset ? preset.slice() : lastVals.slice();
  SLOTS.forEach((_, i) => paintMeter(i));
  syncCode(); updateLogBtn();
  if (!sheet.open) openDialog(sheet);
  setTimeout(() => {
    if (focusId) {
      const m = meters[SLOTS.findIndex(s => s.id === focusId)];
      m.row.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' }); m.el.focus({ preventScroll: true });
    } else if (matchMedia('(pointer: fine)').matches) codeInput.focus();
  }, 80);
}
codeInput.addEventListener('input', () => {
  const digits = codeInput.value.replace(/\D/g, '').slice(0, SLOTS.length);
  if (codeInput.value !== digits) codeInput.value = digits;
  for (let i = 0; i < digits.length; i++) setVal(i, Number(digits[i]) + 1, { noCode: true });
});
codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
sheet.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); } });
$('#allTen').addEventListener('click', () => { SLOTS.forEach((_, i) => setVal(i, 10)); syncCode(); });
$('#resetLast').addEventListener('click', () => {
  draft = lastVals.slice(); SLOTS.forEach((_, i) => paintMeter(i)); syncCode(); updateLogBtn();
});
logBtn.addEventListener('click', submit);
$('#fab').addEventListener('click', () => openSheet());
document.addEventListener('keydown', e => {
  if ((e.key === 'l' || e.key === 'L') && !e.metaKey && !e.ctrlKey && !e.altKey && !document.querySelector('dialog[open]') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); openSheet(); }
});

function submit() {
  if (!complete()) {
    const miss = draft.findIndex(v => v == null);
    if (miss >= 0 && meters[miss]) { meters[miss].row.scrollIntoView({ block: 'center', behavior: 'smooth' }); meters[miss].el.focus({ preventScroll: true }); }
    return;
  }
  const e = { t: new Date().toISOString(), s: SLOTS.length, c: codeOf(draft) };
  pending.push(e); save(LS.pending, pending);
  rebuild(); renderAll();
  closeDialog(sheet);
  const low = SLOTS.map((s, i) => ({ s, v: draft[i] })).sort((a, b) => a.v - b.v)[0];
  toast(low.v >= IN_PLACE ? 'Logged. Everything is in its place.' : `Logged. Fix first: ${low.s.label} (${low.v}).`);
  sync();
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- sync with Google Sheets ---------- */
function setSync(state, msg) {
  $('#syncBtn').dataset.state = state;
  $('#syncText').textContent = msg || ({ local: 'Local only', ok: 'Synced', saving: 'Syncing', queued: 'Queued', error: 'Offline' })[state];
}
async function api(params) {
  const u = new URL(cfg.url);
  u.searchParams.set('key', cfg.key);
  Object.keys(params).forEach(k => u.searchParams.set(k, params[k]));
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
  try {
    const res = await fetch(u.toString(), { signal: ctl.signal, redirect: 'follow', cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(to); }
}
async function sync() {
  if (!cfg.url || !cfg.key) { setSync('local'); return; }
  if (syncing) return;
  syncing = true; setSync('saving');
  try {
    const r = await api({ action: 'list' });
    if (!r.ok) throw new Error(r.error || 'list failed');
    confirmed = r.rows.map(([t, s, c]) => ({ t, s: Number(s) || String(c).length, c: String(c) }));
    const have = new Set(confirmed.map(e => e.t));
    pending = pending.filter(e => !have.has(e.t));
    for (const e of [...pending]) {
      const w = await api({ action: 'add', t: e.t, schema: e.s, code: e.c });
      if (!w.ok) throw new Error(w.error || 'save failed');
      pending = pending.filter(x => x.t !== e.t); confirmed.push(e);
    }
    save(LS.confirmed, confirmed); save(LS.pending, pending);
    rebuild(); renderAll();
    setSync('ok'); lastSyncAt = Date.now();
  } catch (err) {
    save(LS.confirmed, confirmed); save(LS.pending, pending); rebuild(); renderAll();
    const msg = String(err && err.message || err);
    if (/unauthorized/.test(msg)) setSync('error', 'Check secret');
    else if (pending.length) setSync('queued', pending.length + ' queued');
    else setSync('error', 'Offline');
  } finally { syncing = false; }
}

/* connect dialog */
const connect = $('#connect');
$('#syncBtn').addEventListener('click', () => { $('#cfgUrl').value = cfg.url || ''; $('#cfgKey').value = cfg.key || ''; openDialog(connect); });
$('#cfgSave').addEventListener('click', () => {
  cfg = { url: $('#cfgUrl').value.trim(), key: $('#cfgKey').value.trim() };
  save(LS.cfg, cfg); closeDialog(connect);
  if (cfg.url && cfg.key) { toast('Connecting'); sync(); } else setSync('local');
});
$('#cfgOff').addEventListener('click', () => { cfg = { url: '', key: '' }; save(LS.cfg, cfg); closeDialog(connect); setSync('local'); toast('Disconnected. Entries stay on this device.'); });
$('#cfgCopy').addEventListener('click', async () => {
  const url = $('#cfgUrl').value.trim(), key = $('#cfgKey').value.trim();
  if (!url || !key) { toast('Fill in both fields first'); return; }
  const link = location.origin + location.pathname + '#u=' + encodeURIComponent(url) + '&k=' + encodeURIComponent(key);
  try { await navigator.clipboard.writeText(link); toast('Setup link copied. Open it on your phone once.'); } catch (e) { toast('Copy failed'); }
});

/* ---------- theme ---------- */
$('#themeBtn').addEventListener('click', e => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  const r = e.currentTarget.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const apply = () => {
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(LS.theme, next); } catch (err) {}
    document.querySelector('meta[name="theme-color"]').setAttribute('content', next === 'dark' ? '#090b11' : '#eef1f7');
  };
  if (!document.startViewTransition || reduceMotion) { apply(); return; }
  const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  document.startViewTransition(apply).ready.then(() => {
    document.documentElement.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`] },
      { duration: 750, easing: EASE, pseudoElement: '::view-transition-new(root)' });
  });
});

/* ---------- pointer glow on panels ---------- */
document.querySelectorAll('.panel').forEach(p => {
  p.addEventListener('pointermove', e => {
    const r = p.getBoundingClientRect();
    p.style.setProperty('--mx', (e.clientX - r.left) + 'px'); p.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
});

/* ---------- boot ---------- */
function handleSetupHash() {
  if (!location.hash || location.hash.length < 3) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('u') && h.get('k')) {
    cfg = { url: h.get('u'), key: h.get('k') }; save(LS.cfg, cfg);
    history.replaceState(null, '', location.pathname + location.search);
    toast('Connected on this device');
  }
}
function handleQuery() {
  const q = new URLSearchParams(location.search);
  const c = q.get('c'), wantLog = q.has('log');
  if (c == null && !wantLog) return;
  history.replaceState(null, '', location.pathname);
  if (c != null) {
    const digits = c.replace(/\D/g, '').slice(0, SLOTS.length);
    const d = SLOTS.map((_, i) => i < digits.length ? Number(digits[i]) + 1 : slotState(i).cur);
    if (digits.length && d.every(v => v != null)) { draft = d; submit(); return; }
    openSheet(null, d); return;
  }
  openSheet();
}

buildRing();
handleSetupHash();
rebuild();
setSync(cfg.url && cfg.key ? 'saving' : 'local');
requestAnimationFrame(() => {
  renderAll();
  [seriesSeg, rangeSeg].forEach(s => movePill(s, true));
  handleQuery();
  sync();
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => [seriesSeg, rangeSeg].forEach(s => movePill(s, true)));
addEventListener('resize', () => [seriesSeg, rangeSeg].forEach(s => movePill(s, true)));
addEventListener('online', sync);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  renderHeader();
  if (Date.now() - lastSyncAt > 30000) sync();
});
setInterval(renderHeader, 60000);
})();
</script>
</body>
